<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — XKCD Search</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <div class="header-brand">
    <span class="logo">🔍</span>
    <h1>XKCD Search</h1>
  </div>
  <nav class="header-nav">
    <a href="/">Search</a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </nav>
</header>

<main>
  <div class="auth-card">
    <h2>Create account</h2>
    <p class="subtitle">Join to search XKCD comics</p>

    {{if .Error}}
    <div class="alert alert-error">⚠️ {{.Error}}</div>
    {{end}}

    <form method="POST" action="/register">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="name" placeholder="Choose a username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a password" required>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</main>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }
  (function() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = saved === 'dark' ? '☀️ Light' : '🌙 Dark';
    });
  })();
</script>
</body>
</html>
