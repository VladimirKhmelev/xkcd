<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — XKCD Search</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <h1>XKCD Search</h1>
  <a href="/">Search</a>
</header>
<main>
  <div class="card" style="max-width:400px;margin:40px auto">
    <h2>Register</h2>
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/register">
      <div style="margin-bottom:12px">
        <input type="text" name="name" placeholder="Username" required style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <input type="password" name="password" placeholder="Password" required style="width:100%">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
    </form>
    <p style="margin-top:16px;text-align:center">Already have an account? <a href="/login">Log in</a></p>
  </div>
</main>
</body>
</html>
