name: CI

on:
  push:
  pull_request:

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: search-services/go.mod
          cache-dependency-path: search-services/go.sum

      - name: Install protolint
        run: go install github.com/yoheimuta/protolint/cmd/protolint@v0.53.0

      - name: Run protolint
        run: protolint lint search-services/proto

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: search-services

  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: search-services/go.mod
          cache-dependency-path: search-services/go.sum

      - name: Run unit tests
        run: make unit

      - name: Check coverage threshold
        working-directory: search-services
        run: |
          COVERAGE=$(go tool cover -func cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: $COVERAGE%"
          awk "BEGIN { if ($COVERAGE+0 < 50) { print \"Coverage \" $COVERAGE \"% is below 50%\"; exit 1 } }"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cover.html

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Start services
        run: docker compose up -d api words update search postgres nats frontend redis

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:28080/api/ping && break
            echo "Waiting for API... ($i)"
            [ $i -eq 30 ] && echo "Timeout waiting for API" && exit 1
            sleep 5
          done

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:28090/ && break
            echo "Waiting for frontend... ($i)"
            [ $i -eq 15 ] && echo "Timeout waiting for frontend" && exit 1
            sleep 3
          done

      - name: Smoke test frontend
        run: |
          curl -sf http://localhost:28090/ | grep -q "XKCD Search"
          curl -sf "http://localhost:28090/?phrase=linux" | grep -q "XKCD Search"
          curl -sf http://localhost:28090/admin | grep -q "XKCD Admin"
          curl -sf http://localhost:28090/login | grep -q "Log in"
          curl -sf http://localhost:28090/register | grep -q "Register"

      - name: Smoke test swagger
        run: |
          curl -sf http://localhost:28080/swagger/index.html | grep -q "Swagger UI"
          curl -sf http://localhost:28080/swagger/doc.json | python3 -c "
          import sys, json
          spec = json.load(sys.stdin)
          paths = spec.get('paths', {})
          required = ['/api/search', '/api/login', '/api/register', '/api/user/login']
          for p in required:
              assert p in paths, f'missing path: {p}'
          print('swagger spec OK, paths:', list(paths.keys()))
          "

      - name: Run integration tests
        run: docker compose run --rm tests

      - name: Upload swagger docs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swagger-docs
          path: |
            search-services/api/docs/swagger.json
            search-services/api/docs/swagger.yaml

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
