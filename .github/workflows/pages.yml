name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: public/coverage

      - name: Download swagger docs
        uses: actions/download-artifact@v4
        with:
          name: swagger-docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: public/swagger

      - name: Build swagger UI
        run: |
          curl -sL https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js -o public/swagger/swagger-ui-bundle.js
          curl -sL https://unpkg.com/swagger-ui-dist/swagger-ui.css -o public/swagger/swagger-ui.css
          cat > public/swagger/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>XKCD Search API</title>
            <link rel="stylesheet" href="swagger-ui.css">
          </head>
          <body>
          <div id="swagger-ui"></div>
          <script src="swagger-ui-bundle.js"></script>
          <script>
            SwaggerUIBundle({ url: "swagger.json", dom_id: "#swagger-ui", presets: [SwaggerUIBundle.presets.apis] })
          </script>
          </body>
          </html>
          EOF

      - name: Build index page
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>XKCD Search</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; }
              a { display: block; margin: 12px 0; font-size: 18px; }
            </style>
          </head>
          <body>
            <h1>XKCD Search</h1>
            <a href="swagger/">📖 Swagger UI — API документация</a>
            <a href="coverage/cover.html">📊 Coverage Report — покрытие тестами</a>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
